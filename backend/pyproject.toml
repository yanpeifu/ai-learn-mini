[project]
name = "ai-learn-mini-backend"
version = "0.1.0"
description = "AI 闯关学习小程序 · 后端（FastAPI + SQLAlchemy + LangChain）"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "pyjwt==2.14.0",
  "langchain==1.4.1",
  "langchain-core==1.6.3",
  "langchain-openai==1.6.2",
  "langchain-tavily==0.2.18",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 说明：开发机上有沙箱限制，Python 进程无法在项目目录内新建文件（.pytest_cache），
# 关掉 cacheprovider 可避免 pytest 卡住；覆盖率数据文件请用 COVERAGE_FILE 指到临时目录。
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
