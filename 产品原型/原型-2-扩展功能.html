<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 2 · 扩展功能 7 屏 — AI 闯关学习小程序</title>
<style>
  :root{
    --paper:#FFFCF7; --card:#FFF; --ink:#33302E; --ink2:#8A8078; --line:#F0E9E0;
    --orange:#FFA85C; --orange-d:#EE9247; --mint:#7ED9A8; --mint-i:#2A7D57;
    --coral:#FF9A9A; --coral-i:#C4564F; --lav:#B9A6F5; --yellow:#FFE08A;
    --r-card:24px; --r-btn:18px; --bw:2.5px;
    --hard:0 2px 0 var(--ink);
    --soft:0 2px 0 var(--ink), 0 10px 20px rgba(51,48,46,.06);
    --gloss:inset 0 2px 0 rgba(255,255,255,.65);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:40px 22px 90px;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1420px;margin:0 auto}
  h1{font-size:25px;margin:0 0 5px}
  .lead{color:var(--ink2);font-size:13.5px;margin:0 0 8px}
  .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:30px}
  .badge{display:inline-block;background:var(--lav);border:var(--bw) solid var(--ink);
    border-radius:999px;padding:4px 13px;font-size:12px;font-weight:700;box-shadow:var(--hard)}
  .badge a{color:inherit;text-decoration:none}
  .badge.g{background:var(--mint)} .badge.y{background:var(--yellow)}
  .stage{margin:44px 0 18px;display:flex;align-items:center;gap:12px}
  .stage .num{width:34px;height:34px;flex:none;border:var(--bw) solid var(--ink);border-radius:50%;
    background:var(--lav);display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:var(--hard)}
  .stage h2{font-size:17px;margin:0}
  .stage .sub{font-size:12px;color:var(--ink2);margin-left:auto}
  .grid{display:grid;gap:26px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
  @media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:740px){.grid{grid-template-columns:1fr}}

  .cell{margin:0}
  .phone{width:100%;max-width:360px;margin:0 auto;min-height:640px;background:var(--paper);
    border:var(--bw) solid var(--ink);border-radius:32px;box-shadow:var(--soft);
    display:flex;flex-direction:column;overflow:hidden;font-size:14px}
  .sbar{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:10px;color:var(--ink2)}
  .appbar{height:44px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;
    font-weight:700;font-size:14.5px;border-bottom:2px dashed var(--line)}
  .appbar .back{font-size:16px;color:var(--ink2);font-weight:400}
  .appbar .act{margin-left:auto;font-size:14px;color:var(--ink2)}
  .content{flex:1;padding:13px 14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .center{align-items:center;justify-content:center;text-align:center}
  .cap{font-size:11px;color:var(--ink2);line-height:1.5}
  .sec{font-size:11.5px;font-weight:700;color:var(--ink2)}
  .figcap{margin-top:11px;font-size:12.5px;text-align:center}
  .figcap b{display:block;font-size:13px}
  .figcap b .no{display:inline-block;background:var(--lav);border:2px solid var(--ink);
    border-radius:6px;padding:0 6px;font-size:11px;margin-right:5px}
  .figcap span{color:var(--ink2);font-size:11.5px;display:block;margin-top:2px}

  .yb{display:block}
  .yb-xs{width:32px;height:32px;flex:none}
  .yb-sm{width:52px;height:52px;flex:none}
  .yb-md{width:74px;height:74px;margin:0 auto}

  .card{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r-card);
    box-shadow:var(--soft),var(--gloss);padding:13px}
  .btn{display:block;width:100%;text-align:center;cursor:pointer;font-family:inherit;
    border:var(--bw) solid var(--ink);border-radius:var(--r-btn);padding:12px 16px;
    font-size:14.5px;font-weight:700;background:var(--card);color:var(--ink);
    box-shadow:var(--soft),var(--gloss);
    transition:transform 120ms cubic-bezier(.34,1.56,.64,1),box-shadow 120ms ease-out}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink),var(--gloss)}
  .btn-p{background:var(--orange)}
  .btn-p:active{background:var(--orange-d)}
  .btn-sm{padding:6px 11px;font-size:11.5px;border-radius:13px;width:auto;display:inline-block}
  .btnrow{display:flex;gap:9px}
  .btnrow .btn{padding:12px 8px;font-size:13.5px}
  .chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;
    font-size:10.5px;font-weight:700;background:var(--card);box-shadow:0 1px 0 var(--ink)}
  .chip-y{background:var(--yellow)} .chip-m{background:var(--mint)} .chip-l{background:var(--lav)} .chip-c{background:var(--coral)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .tipbar{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:16px;
    padding:9px 12px;font-size:11.5px;box-shadow:var(--hard);line-height:1.6}
  .tipico{width:14px;height:14px;flex:none;fill:none;stroke:var(--ink);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;margin-top:2px}

  /* ================= 关卡地图（SVG 蜿蜒路径） ================= */
  .mapcard{background:var(--card);border:var(--bw) solid var(--ink);border-radius:20px;
    box-shadow:var(--hard);padding:10px 12px;display:flex;gap:9px;align-items:center}
  .mapwrap{position:relative;flex:1;min-height:430px;margin:2px 0}
  .map-svg{position:absolute;inset:0;width:100%;height:100%}
  .node{position:absolute;width:74px;height:74px;margin-left:-37px;margin-top:-37px;
    border:3px solid var(--ink);border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:var(--card);box-shadow:0 3px 0 var(--ink);
    cursor:pointer;transition:transform 140ms cubic-bezier(.34,1.56,.64,1),box-shadow 140ms}
  .node:hover{transform:scale(1.06)}
  .node .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .node .tt{font-size:10.5px;font-weight:800;margin-top:2px}
  .node .st{font-size:9.5px;color:var(--ink2);margin-top:1px}
  .node.done{background:var(--mint)}
  .node.now{background:var(--orange);box-shadow:0 3px 0 var(--ink),0 0 0 8px rgba(255,168,92,.3)}
  .node.lock{background:#F5F0E9;border-style:dashed;color:#BCB2A7;box-shadow:none;cursor:not-allowed}
  .node.now .flag{position:absolute;top:-42px;left:16px;width:44px;height:44px}
  .node-panel{background:var(--paper);border:2px dashed var(--ink);border-radius:16px;padding:9px 12px;
    font-size:11.5px;min-height:52px}
  .node-panel b{display:block;font-size:12.5px;margin-bottom:2px}

  /* ================= 错题本 ================= */
  .kpis{display:flex;gap:9px}
  .kpis>div{flex:1;background:var(--card);border:var(--bw) solid var(--ink);border-radius:16px;
    box-shadow:var(--hard);padding:9px 4px;text-align:center}
  .kpis b{display:block;font-size:18px;font-weight:800;line-height:1.15}
  .kpis span{font-size:10px;color:var(--ink2)}
  .filters{display:flex;gap:6px}
  .filters span{font-size:11px;font-weight:700;border:2px solid var(--ink);border-radius:999px;
    padding:2px 10px;background:var(--card)}
  .filters span.on{background:var(--orange)}
  .wrong{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;
    box-shadow:var(--hard);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .wrong .h{display:flex;align-items:center;gap:8px}
  .wrong .h b{font-size:12.5px}
  .wrong .h .t{margin-left:auto;font-size:10.5px;color:var(--ink2);flex:none}
  .wrong .q{font-size:11.5px;color:#6B645D;line-height:1.5;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wrong .f{display:flex;align-items:center;gap:8px}
  .mbar{flex:1;height:9px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
  .mbar i{display:block;height:100%}

  /* ================= 答题（复用） ================= */
  .prog{height:12px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--card);
    box-shadow:var(--hard);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--orange);border-right:var(--bw) solid var(--ink)}
  .stem{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;
    box-shadow:var(--soft),var(--gloss);padding:13px;font-size:14px;font-weight:600;line-height:1.6}
  .opt{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--ink);
    border-radius:16px;box-shadow:var(--hard);padding:10px 12px;font-size:12.5px}
  .opt .k{flex:none;width:23px;height:23px;border:2px solid var(--ink);border-radius:50%;
    background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px}
  .opt-pick{background:var(--yellow)}
  .opt-sg{background:var(--lav)}

  /* ================= 复盘报告 ================= */
  .chartbox{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;
    box-shadow:var(--hard);padding:11px}
  .chartbox .t{font-size:12px;font-weight:700;margin-bottom:5px}
  .legend{display:flex;gap:11px;font-size:10.5px;color:var(--ink2);margin-top:5px;justify-content:center}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;border:1.5px solid var(--ink);margin-right:4px}
  .modes{display:flex;flex-direction:column;gap:6px}
  .mode{display:flex;align-items:center;gap:8px;font-size:12px}
  .mode .dot{width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;flex:none}

  /* ================= 海报 ================= */
  .poster{background:var(--card);border:var(--bw) solid var(--ink);border-radius:22px;
    box-shadow:0 4px 0 var(--ink);padding:14px;display:flex;flex-direction:column;
    align-items:center;gap:8px;text-align:center}
  .poster .tm{font-size:10.5px;font-weight:700;color:var(--ink2);align-self:flex-start}
  .poster h3{margin:0;font-size:15px;line-height:1.4}
  .poster .sc{font-size:30px;font-weight:800;line-height:1}
  .poster .box{width:100%;background:var(--paper);border:2px dashed var(--ink);border-radius:15px;
    padding:9px;text-align:left}
  .poster .box b{font-size:11px;display:block;margin-bottom:4px}
  .poster .box ul{margin:0;padding-left:14px}
  .poster .box li{font-size:10.5px;color:#6B645D;margin-bottom:2px;line-height:1.5}
  .qr{width:58px;height:58px;border:2px solid var(--ink);border-radius:10px;background:var(--card);
    background-image:linear-gradient(var(--ink) 2px,transparent 2px),linear-gradient(90deg,var(--ink) 2px,transparent 2px);
    background-size:10px 10px}

  /* ================= 挑战落地页 ================= */
  .invite{background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:22px;
    box-shadow:var(--soft),var(--gloss);padding:14px;text-align:center}
  .invite .who{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
  .topicbox{background:var(--card);border:2px dashed var(--ink);border-radius:15px;padding:9px 11px;
    font-size:11px;text-align:left}
  .topicbox b{display:block;font-size:11.5px;margin-bottom:4px}
</style>
</head>

<div class="wrap">
  <h1>原型 2 · 扩展功能 <span style="color:var(--coral-i)">7 屏</span></h1>
  <p class="lead">对应 V0.5 及以后的设计点：L1 关卡地图 · E2/E3 错题本与间隔重复 · L9 复盘报告 · L5 分享海报与裂变闭环</p>
  <div class="topbar">
    <span class="badge"><a href="原型-0-入口导航.html">← 返回原型中心</a></span>

    <figure class="cell">

            </div>

          </div>

          <div class="mapwrap" id="mapwrap">
            <!-- 蜿蜒路径：三次贝塞尔，左右交替蜿蜒 -->

                    fill="none" stroke="#58C86E" stroke-width="4" stroke-dasharray="2 12"
                    stroke-linecap="round"/>

(function(){

    lv1:{ t:'第 1 关 · 基础概念', d:'已通过，拿到 3 星。可以点击重刷，成绩取最高分。', ok:1 },

  };
  var panel = document.getElementById('nodePanel');
  document.querySelectorAll('.node').forEach(function(n){
    n.addEventListener('click', function(){
      var k = n.getAttribute('data-node'), v = info[k];
      panel.innerHTML = '<b>'.concat(v.t, '</b>', v.d,
        v.ok ? '<div style="margin-top:6px"><span class="chip chip-m">点击进入</span></div>'
             : '<div style="margin-top:6px"><span class="chip">暂未解锁</span></div>');
      if (!v.ok) { panel.style.borderColor = 'var(--coral-i)'; }
      else { panel.style.borderColor = 'var(--ink)'; }
    });
  });
})();
