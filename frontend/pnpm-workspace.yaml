allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
# pnpm 11 起，依赖构建脚本白名单写在这里（package.json 的 pnpm 字段已不再被读取）。
# 这几个是 Taro / SWC / esbuild / core-js 的原生构建脚本，不执行会导致编译失败或产物异常。
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tarojs/binding'
  - '@tarojs/cli'
  - core-js
  - core-js-pure
  - esbuild
